# What this deploys, and why each part is deliberately wrong:
#
# - A schema + landing volume inside the pre-provisioned catalog — this
#   part is fine, it's just plumbing for the exercise.
# - A job wired to the three legacy notebooks (../bronze, ../silver,
#   ../gold — relative to this file), configured the way a rushed
#   one-off actually gets deployed: one shared cluster with no
#   autotermination, an old runtime, a fixed worker count instead of
#   autoscale, no tags, no failure notifications, and no schedule (a real
#   version of this would be scheduled and left running — we don't
#   provision that here so a shared training workspace doesn't accumulate
#   a daily job per learner). No `permissions:` block either: whoever runs
#   `bundle deploy` becomes the owner, which is the point — an individual,
#   not a group.

resources:
  schemas:
    taxi_legacy:
      catalog_name: ${var.catalog}
      name: taxi_legacy
      comment: "Legacy NYC taxi pipeline — flat, unlayered, pre-kit. Seeded for the brownfield exercise."

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: taxi_legacy
      name: landing
      volume_type: MANAGED
      depends_on:
        - taxi_legacy

  jobs:
    legacy_taxi_job:
      name: "Taxi Analytics - Legacy"
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../bronze/ingest_trips.py
          job_cluster_key: shared

        - task_key: clean
          depends_on: [{ task_key: ingest }]
          notebook_task:
            notebook_path: ../silver/clean_trips.py
          job_cluster_key: shared

        - task_key: kpi
          depends_on: [{ task_key: clean }]
          notebook_task:
            notebook_path: ../gold/kpi_by_borough_hour.py
          job_cluster_key: shared

      job_clusters:
        - job_cluster_key: shared
          new_cluster:
            spark_version: 13.3.x-scala2.12 # several versions behind current
            node_type_id: i3.xlarge
            num_workers: 2 # fixed, not autoscale
            # no autotermination_minutes — left running is the anti-pattern
