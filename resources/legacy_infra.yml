# What this deploys, and why each part is deliberately wrong:
#
# - A schema + landing volume inside the pre-provisioned catalog — this
#   part is fine, it's just plumbing for the exercise.
# - A job wired to the three legacy notebooks (../bronze, ../silver,
#   ../gold — relative to this file), configured the way a rushed
#   one-off actually gets deployed: no tags, no failure notifications, and
#   no schedule (a real version of this would be scheduled and left
#   running — we don't provision that here so a shared training workspace
#   doesn't accumulate a daily job per learner). No `permissions:` block
#   either: whoever runs `bundle deploy` becomes the owner, which is the
#   point — an individual, not a group.
#
# Compute is serverless (no job_clusters block) rather than a classic
# all-purpose cluster — a real version of this legacy job would more
# likely be on a shared classic cluster with no autotermination and an
# old runtime, but that requires cluster-creation rights most learners
# won't have. Serverless sidesteps that permission entirely, at the cost
# of losing the "no autotermination" anti-pattern as something you
# actually discover and fix — it's described here instead, not deployed.

resources:
  schemas:
    taxi_legacy:
      catalog_name: ${var.catalog}
      name: taxi_legacy
      comment: "Legacy NYC taxi pipeline — flat, unlayered, pre-kit. Seeded for the brownfield exercise."

  volumes:
    landing:
      catalog_name: ${var.catalog}
      # Referencing the schema resource (not the literal string "taxi_legacy")
      # is what makes Terraform create the schema before the volume --
      # `volumes` has no `depends_on` field, this is the supported way to
      # express the same ordering.
      schema_name: ${resources.schemas.taxi_legacy.name}
      name: landing
      volume_type: MANAGED

  jobs:
    legacy_taxi_job:
      name: "Taxi Analytics - Legacy"
      # No job_clusters block — these tasks run on serverless compute.
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../bronze/ingest_trips.py

        - task_key: clean
          depends_on: [{ task_key: ingest }]
          notebook_task:
            notebook_path: ../silver/clean_trips.py

        - task_key: kpi
          depends_on: [{ task_key: clean }]
          notebook_task:
            notebook_path: ../gold/kpi_by_borough_hour.py
