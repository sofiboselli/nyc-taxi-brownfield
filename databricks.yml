bundle:
  name: nyc-taxi-brownfield-seed

# mode: development prefixes UC schema names with "<user>_" by default.
# The notebooks hardcode the exact schema path rather than a bundle
# variable, so a prefixed name breaks them. `presets.name_prefix: ""`
# looks like the obvious fix and is NOT — it doesn't touch schema naming
# at all. This dedicated flag is the one that does.
experimental:
  skip_name_prefix_for_schema: true

include:
  - resources/*.yml

variables:
  catalog:
    description: "Unity Catalog catalog for this project"
    default: dev_ai_kit_demo_brownfield

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-001bbe9b-5a5e.cloud.databricks.com
