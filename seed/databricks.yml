# Seed bundle — stands up the "already productive" legacy mess.
#
# This is throwaway infrastructure-as-code, not the project bundle. It
# exists so anyone can materialize the brownfield starting state
# themselves (schema, landing volume, the badly-configured job) instead of
# depending on someone manually clicking through the Databricks UI first.
# Deploy it once at the start of the exercise, then leave it alone — the
# actual work is rebuilding what it creates, not maintaining this bundle.
#
# The one thing this does NOT create is the catalog itself — that needs
# elevated permissions not every learner has, so it's provisioned once,
# out of band, by whoever set up this exercise. Everything inside the
# catalog is self-service from here.

bundle:
  name: nyc-taxi-brownfield-seed

include:
  - resources/*.yml

variables:
  catalog:
    description: "The pre-provisioned Unity Catalog catalog for this exercise"
    default: dev_ai_kit_demo_brownfield

targets:
  dev:
    default: true
    mode: development
